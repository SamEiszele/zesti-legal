<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email confirmed — Zesti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#F7F5F0; --card:#FFFFFF; --green:#2E6B4F; --green-light:#E8F5EE; --text:#1A1A1A; --text-secondary:#555; --border:#E8E4DC; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }
  .header { background:var(--card); border-bottom:1px solid var(--border); padding:20px 24px; }
  .logo { font-family:'DM Serif Display',serif; font-size:22px; }
  .logo span { color:var(--green); }
  .wrap { max-width:420px; margin:0 auto; padding:64px 24px 80px; text-align:center; }
  .tick { width:64px; height:64px; border-radius:50%; background:var(--green-light); display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  h1 { font-family:'DM Serif Display',serif; font-size:30px; margin-bottom:10px; letter-spacing:-0.4px; }
  p { font-size:15px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="header"><div class="logo">zesti<span>.</span></div></div>
<div class="wrap">
  <div class="tick">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2E6B4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h1>You’re all set</h1>
  <p>Your email is confirmed. Head back to the Zesti app and sign in to get started.</p>
</div>
</body>
</html>
