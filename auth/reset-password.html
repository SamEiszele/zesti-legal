<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Zesti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#F7F5F0; --card:#FFFFFF; --green:#2E6B4F; --green-light:#E8F5EE; --text:#1A1A1A; --text-secondary:#555; --border:#E8E4DC; --error:#9B1C1C; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }
  .header { background:var(--card); border-bottom:1px solid var(--border); padding:20px 24px; }
  .logo { font-family:'DM Serif Display',serif; font-size:22px; }
  .logo span { color:var(--green); }
  .wrap { max-width:420px; margin:0 auto; padding:40px 24px 80px; }
  h1 { font-family:'DM Serif Display',serif; font-size:30px; margin-bottom:8px; letter-spacing:-0.4px; }
  p.lead { font-size:14px; color:var(--text-secondary); margin-bottom:24px; }
  .card { background:var(--card); border-radius:14px; padding:22px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  input { width:100%; font:inherit; font-size:15px; padding:13px 14px; border:1px solid var(--border); border-radius:12px; background:#FBFAF7; margin-bottom:14px; }
  input:focus { outline:2px solid var(--green); outline-offset:1px; }
  button { width:100%; font:inherit; font-weight:600; font-size:15px; padding:14px; border:0; border-radius:14px; background:var(--green); color:#fff; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .msg { font-size:13px; border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .msg.error { background:#FDEAEA; color:var(--error); }
  .msg.ok { background:var(--green-light); color:var(--green); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="header"><div class="logo">zesti<span>.</span></div></div>
<div class="wrap">
  <h1>Choose a new password</h1>
  <p class="lead" id="lead">Checking your reset link…</p>

  <div class="card" id="form-card" hidden>
    <div class="msg error" id="error" hidden></div>
    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" placeholder="Type it again" required>
      <button id="submit" type="submit">Update password</button>
    </form>
  </div>

  <div class="card" id="done-card" hidden>
    <div class="msg ok">Your password has been updated. Open the Zesti app and sign in with your new password.</div>
  </div>

  <div class="card" id="invalid-card" hidden>
    <div class="msg error">This reset link has expired or has already been used. Go back to the Zesti app, tap “Forgot your password?” and we’ll send you a fresh one.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // The publishable key is designed to be public; it carries no privileges on its own.
  var sb = supabase.createClient(
    'https://jdagcrbduuhzddeaxajs.supabase.co',
    'sb_publishable_Z1rFsgTc2zuDk4Ds_u4wVA_A253HBBh'
  );
  var el = function (id) { return document.getElementById(id); };
  var ready = false;

  function showForm() {
    ready = true;
    el('lead').textContent = 'Pick something you’ll remember — at least 8 characters.';
    el('form-card').hidden = false;
  }

  sb.auth.onAuthStateChange(function (event) {
    if (event === 'PASSWORD_RECOVERY') showForm();
  });

  // If no recovery event arrives, the link is missing, used, or expired.
  setTimeout(function () {
    if (!ready) {
      el('lead').textContent = '';
      el('invalid-card').hidden = false;
    }
  }, 4000);

  el('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = el('pw').value, pw2 = el('pw2').value;
    var err = el('error');
    err.hidden = true;
    if (pw.length < 8) { err.textContent = 'Your password needs to be at least 8 characters.'; err.hidden = false; return; }
    if (pw !== pw2)    { err.textContent = 'Those two passwords don’t match.'; err.hidden = false; return; }
    el('submit').disabled = true;
    var res = await sb.auth.updateUser({ password: pw });
    if (res.error) {
      err.textContent = res.error.message;
      err.hidden = false;
      el('submit').disabled = false;
      return;
    }
    await sb.auth.signOut();
    el('form-card').hidden = true;
    el('lead').textContent = '';
    el('done-card').hidden = false;
  });
</script>
</body>
</html>
